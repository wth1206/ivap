# GPU overlay: requires NVIDIA driver + Docker Desktop WSL2 GPU support.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
services:
  backend:
    build:
      args:
        TORCH_WHEEL_URL: https://mirrors.aliyun.com/pytorch-wheels/cu118/torch-2.1.2%2Bcu118-cp39-cp39-linux_x86_64.whl
        TORCHVISION_WHEEL_URL: https://mirrors.aliyun.com/pytorch-wheels/cu118/torchvision-0.16.2%2Bcu118-cp39-cp39-linux_x86_64.whl
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
